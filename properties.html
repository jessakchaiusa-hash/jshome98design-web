<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ค้นหาทรัพย์ | JS Home</title>
<meta name="description" content="ค้นหาทรัพย์ NPA ธอส. ทั่วประเทศ กรองตามจังหวัด อำเภอ และประเภททรัพย์" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="icon" type="image/png" href="assets/img/logo.png" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark"><img src="assets/img/logo.png" alt="JS Home logo" /></span>
      JS Home <span style="color:var(--text-muted);font-weight:500;font-size:14px;">บ้านพร้อมอยู่</span>
    </a>
    <nav class="nav-links">
      <a href="properties.html">ค้นหาทรัพย์</a>
      <a href="index.html#how">ขั้นตอนการซื้อ</a>
      <a href="index.html#about">เกี่ยวกับเรา</a>
    </nav>
    <a href="index.html" class="btn btn-ghost btn-sm">กลับหน้าแรก</a>
  </div>
</header>

<section class="section-tight">
  <div class="container">

    <div class="section-head" style="margin-bottom:24px;">
      <span class="section-eyebrow">ค้นหาทรัพย์</span>
      <h2>ทรัพย์ NPA ธอส. ทั่วประเทศ</h2>
    </div>

    <div class="filter-bar">
      <div class="field">
        <label for="fSearch">ค้นหา</label>
        <input id="fSearch" type="text" placeholder="ชื่อโครงการ, ที่อยู่..." />
      </div>
      <div class="field">
        <label for="fProvince">จังหวัด</label>
        <select id="fProvince"><option value="">ทั้งหมด</option></select>
      </div>
      <div class="field">
        <label for="fDistrict">อำเภอ/เขต</label>
        <select id="fDistrict" disabled title="เลือกจังหวัดก่อน"><option value="">ทั้งหมด</option></select>
      </div>
      <div class="field">
        <label for="fType">ประเภท</label>
        <select id="fType">
          <option value="">ทั้งหมด</option>
        </select>
      </div>
      <div class="field">
        <label for="fPrice">ราคา</label>
        <select id="fPrice">
          <option value="">ทุกราคา</option>
          <option value="0-500000">ไม่เกิน 5 แสน</option>
          <option value="500000-1000000">5 แสน – 1 ล้าน</option>
          <option value="1000000-2000000">1 – 2 ล้าน</option>
          <option value="2000000-3000000">2 – 3 ล้าน</option>
          <option value="3000000-5000000">3 – 5 ล้าน</option>
          <option value="5000000-">5 ล้านขึ้นไป</option>
        </select>
      </div>
      <div class="field">
        <label for="fSort">เรียงตาม</label>
        <select id="fSort">
          <option value="">อัปเดตล่าสุด</option>
          <option value="price_asc">ราคาต่ำ → สูง</option>
          <option value="price_desc">ราคาสูง → ต่ำ</option>
          <option value="newest">ทรัพย์เข้าใหม่</option>
        </select>
      </div>
      <div class="field" style="align-self:end;">
        <button class="btn btn-primary" id="fSubmit" style="width:100%;">ค้นหา</button>
      </div>
    </div>

    <div class="result-meta">
      <span id="resultCount">กำลังโหลด...</span>
      <div class="view-toggle">
        <button class="view-toggle-btn active" id="btnViewList" type="button">📋 รายการ</button>
        <button class="view-toggle-btn" id="btnViewMap" type="button">🗺️ แผนที่</button>
      </div>
      <span id="pageInfo"></span>
    </div>

    <div class="property-grid" id="propertyGrid">
      <!-- skeleton loading -->
      <div class="property-card"><div class="property-thumb skeleton"></div><div class="property-body"><div class="skeleton" style="height:16px;width:80%;border-radius:6px;margin-bottom:8px;"></div><div class="skeleton" style="height:12px;width:60%;border-radius:6px;"></div></div></div>
      <div class="property-card"><div class="property-thumb skeleton"></div><div class="property-body"><div class="skeleton" style="height:16px;width:80%;border-radius:6px;margin-bottom:8px;"></div><div class="skeleton" style="height:12px;width:60%;border-radius:6px;"></div></div></div>
      <div class="property-card"><div class="property-thumb skeleton"></div><div class="property-body"><div class="skeleton" style="height:16px;width:80%;border-radius:6px;margin-bottom:8px;"></div><div class="skeleton" style="height:12px;width:60%;border-radius:6px;"></div></div></div>
    </div>

    <div class="pagination" id="pagination"></div>

    <!-- แผนที่ (ซ่อนไว้ก่อน สลับด้วยปุ่ม) -->
    <div id="mapView" style="display:none;">
      <div id="mapNote" class="map-note"></div>
      <div id="propertyMap"></div>
    </div>

  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-row">
      <div class="brand" style="font-size:16px;">JS Home <span style="color:var(--text-muted);font-weight:500;font-size:12.5px;">บ้านพร้อมอยู่</span></div>
      <div>© 2026 JS Home · ราคาและรายละเอียดที่ถูกต้องให้ยึดตามหน้าเว็บ ธอส. เสมอ</div>
    </div>
  </div>
</footer>

<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  const PAGE_SIZE = 24;
  let state = {
    page: 1,
    filters: { search: "", province: "", district: "", type: "", minPrice: "", maxPrice: "", sort: "" },
  };

  const grid = document.getElementById("propertyGrid");
  const resultCount = document.getElementById("resultCount");
  const pageInfo = document.getElementById("pageInfo");
  const pagination = document.getElementById("pagination");

  function readFiltersFromURL() {
    const params = new URLSearchParams(location.search);
    state.filters.province = params.get("province") || "";
  }

  function noImage(el) {
    el.onerror = null;
    el.src = "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='100%' height='100%' fill='%23D8F3DC'/></svg>`
    );
  }

  // ราคาจาก ธอส. (+ ราคาเดิมขีดฆ่า ถ้าเพิ่งลดราคา)
  function priceHtml(p) {
    if (!p.price) return `<div class="property-price muted">ราคาติดต่อธนาคาร</div>`;
    const old = p.prev_price && p.prev_price > p.price
      ? ` <s class="property-price-old">${p.prev_price.toLocaleString("th-TH")}</s>` : "";
    return `<div class="property-price">฿${p.price.toLocaleString("th-TH")}${old}</div>`;
  }

  function renderCard(p) {
    // รูปบน ghbhomecenter.com ถูกบล็อกเมื่อเรียกจากเว็บอื่น → ถือว่าไม่มีรูป
    const img = p.img && !p.img.includes("ghbhomecenter.com") ? p.img : "";
    return `
      <a class="property-card" href="${p.ghb_link}" target="_blank" rel="noopener">
        <div class="property-thumb${img ? "" : " no-img"}">
          <span class="property-type-tag">${p.type || "ทรัพย์"}</span>
          ${p.promo ? `<span class="property-promo-tag">${p.promo.replace(/^ทรัพย์/, "")}</span>` : ""}
          ${img ? `<img src="${img}" alt="${p.name || ""}" loading="lazy"
               onerror="this.onerror=null;this.style.display='none'" />` : ""}
        </div>
        <div class="property-body">
          ${priceHtml(p)}
          <h4>${p.name || "ไม่ระบุชื่อทรัพย์"}</h4>
          <div class="property-loc">📍 ${p.district || ""} ${p.province || ""}</div>
          <div class="property-meta">
            ${p.area ? `<span>📐 ${p.area}</span>` : ""}
            ${p.floor ? `<span>🏢 ${p.floor}</span>` : ""}
          </div>
          <div class="property-cta">ดูรูป-รายละเอียดที่ ธอส. →</div>
        </div>
      </a>
    `;
  }

  async function loadProperties() {
    grid.innerHTML = Array(6).fill(
      `<div class="property-card"><div class="property-thumb skeleton"></div><div class="property-body"><div class="skeleton" style="height:16px;width:80%;border-radius:6px;margin-bottom:8px;"></div><div class="skeleton" style="height:12px;width:60%;border-radius:6px;"></div></div></div>`
    ).join("");
    resultCount.textContent = "กำลังโหลด...";

    try {
      const { data, total } = await fetchProperties({
        filters: state.filters,
        page: state.page,
        pageSize: PAGE_SIZE,
      });

      if (!data.length) {
        grid.innerHTML = `<div class="state-msg" style="grid-column:1/-1;">ไม่พบทรัพย์ที่ตรงกับเงื่อนไข ลองปรับตัวกรองใหม่</div>`;
        resultCount.textContent = "พบ 0 รายการ";
        pageInfo.textContent = "";
        pagination.innerHTML = "";
        return;
      }

      grid.innerHTML = data.map(renderCard).join("");
      resultCount.textContent = `พบ ${total.toLocaleString("th-TH")} รายการ`;

      const totalPages = Math.max(Math.ceil(total / PAGE_SIZE), 1);
      pageInfo.textContent = `หน้า ${state.page} จาก ${totalPages.toLocaleString("th-TH")}`;
      renderPagination(totalPages);
    } catch (e) {
      grid.innerHTML = `<div class="state-msg" style="grid-column:1/-1;">โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง</div>`;
      resultCount.textContent = "";
      console.error(e);
    }
  }

  function renderPagination(totalPages) {
    pagination.innerHTML = "";
    const mkBtn = (label, page, disabled = false, active = false) => {
      const b = document.createElement("button");
      b.className = "page-btn";
      b.textContent = label;
      b.disabled = disabled;
      if (active) { b.style.background = "var(--green-800)"; b.style.color = "white"; b.style.borderColor = "var(--green-800)"; }
      b.onclick = () => { state.page = page; loadProperties(); window.scrollTo({ top: 0, behavior: "smooth" }); };
      return b;
    };
    pagination.appendChild(mkBtn("← ก่อนหน้า", state.page - 1, state.page <= 1));
    pagination.appendChild(mkBtn(String(state.page), state.page, false, true));
    if (state.page < totalPages) pagination.appendChild(mkBtn(String(state.page + 1), state.page + 1));
    pagination.appendChild(mkBtn("ถัดไป →", state.page + 1, state.page >= totalPages));
  }

  async function initFilters() {
    try {
      const provinces = await fetchProvinceList();
      const sel = document.getElementById("fProvince");
      provinces.forEach((p) => {
        const opt = document.createElement("option");
        opt.value = p; opt.textContent = p;
        if (p === state.filters.province) opt.selected = true;
        sel.appendChild(opt);
      });
    } catch (e) {
      console.error("โหลดรายชื่อจังหวัดไม่สำเร็จ:", e);
    }

    try {
      const types = await fetchTypeList();
      const selType = document.getElementById("fType");
      types.forEach((t) => {
        const opt = document.createElement("option");
        opt.value = t; opt.textContent = t;
        selType.appendChild(opt);
      });
    } catch (e) {
      console.error("โหลดรายชื่อประเภททรัพย์ไม่สำเร็จ:", e);
    }

    await refreshDistrictOptions(state.filters.province);
  }

  // โหลดรายชื่ออำเภอ/เขตใหม่ตามจังหวัดที่เลือก (เรียกตอนเปิดหน้าครั้งแรก และทุกครั้งที่เปลี่ยนจังหวัด)
  async function refreshDistrictOptions(province) {
    const selDistrict = document.getElementById("fDistrict");
    const keepSelected = selDistrict.value;
    selDistrict.innerHTML = '<option value="">ทั้งหมด</option>';

    if (!province) {
      selDistrict.disabled = true;
      selDistrict.title = "เลือกจังหวัดก่อน";
      return;
    }

    selDistrict.disabled = false;
    selDistrict.title = "";
    try {
      const districts = await fetchDistrictList(province);
      districts.forEach((d) => {
        const opt = document.createElement("option");
        opt.value = d; opt.textContent = d;
        if (d === keepSelected) opt.selected = true;
        selDistrict.appendChild(opt);
      });
    } catch (e) {
      console.error("โหลดรายชื่ออำเภอ/เขตไม่สำเร็จ:", e);
    }
  }

  document.getElementById("fProvince").addEventListener("change", (e) => {
    refreshDistrictOptions(e.target.value);
  });

  document.getElementById("fSubmit").addEventListener("click", () => {
    state.filters.search = document.getElementById("fSearch").value.trim();
    state.filters.province = document.getElementById("fProvince").value;
    state.filters.district = document.getElementById("fDistrict").value.trim();
    state.filters.type = document.getElementById("fType").value;
    [state.filters.minPrice = "", state.filters.maxPrice = ""] = document.getElementById("fPrice").value.split("-");
    state.filters.sort = document.getElementById("fSort").value;
    state.page = 1;
    loadProperties();
  });

  document.getElementById("fSearch").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("fSubmit").click();
  });

  readFiltersFromURL();
  initFilters().then(loadProperties);

  // ===== มุมมองแผนที่ =====
  let leafletMap = null;
  let markerClusterGroup = null;
  let mapLoadedForFilters = null; // เก็บ signature ของ filter ล่าสุดที่โหลดแผนที่ไปแล้ว

  const btnViewList = document.getElementById("btnViewList");
  const btnViewMap = document.getElementById("btnViewMap");
  const mapView = document.getElementById("mapView");
  const mapNote = document.getElementById("mapNote");

  function filterSignature() {
    return JSON.stringify(state.filters);
  }

  function initMapIfNeeded() {
    if (leafletMap) return;
    leafletMap = L.map("propertyMap").setView([13.7563, 100.5018], 6); // ศูนย์กลางประเทศไทยคร่าวๆ
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19,
    }).addTo(leafletMap);
    markerClusterGroup = L.markerClusterGroup({
      chunkedLoading: true,
      iconCreateFunction: function (cluster) {
        const count = cluster.getChildCount();
        const size = count < 50 ? 34 : count < 200 ? 42 : 50;
        return L.divIcon({
          html: `<div class="cluster-pin" style="width:${size}px;height:${size}px;line-height:${size}px;">${count}</div>`,
          className: "cluster-pin-wrap",
          iconSize: L.point(size, size),
        });
      },
    });
    leafletMap.addLayer(markerClusterGroup);

    // ไอคอนหมุดสีส้ม (ตามโทนแบรนด์) แทนหมุดสีน้ำเงินเริ่มต้นของ Leaflet
    // สร้างตรงนี้ (หลังแน่ใจว่า L โหลดเสร็จแล้ว) กันปัญหาลำดับการโหลดสคริปต์
    window._orangeIcon = L.divIcon({
      className: "orange-pin-wrap",
      html: '<div class="orange-pin"></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 20],
      popupAnchor: [0, -18],
    });
  }

  async function loadMapMarkers() {
    initMapIfNeeded();
    if (mapLoadedForFilters === filterSignature()) return; // filter เดิม ไม่ต้องโหลดซ้ำ

    mapNote.textContent = "กำลังโหลดตำแหน่งทรัพย์บนแผนที่...";
    markerClusterGroup.clearLayers();

    try {
      const rows = await fetchPropertiesForMap({ filters: state.filters, limit: 20000 });
      const bounds = [];

      rows.forEach((p) => {
        const lat = parseFloat(p.lat);
        const lng = parseFloat(p.lng);
        if (isNaN(lat) || isNaN(lng)) return;

        const marker = L.marker([lat, lng], { icon: window._orangeIcon });
        marker.bindPopup(`
          <div class="map-popup">
            ${priceHtml(p)}
            <b>${p.name || "ไม่ระบุชื่อ"}</b><br/>
            <span>${p.type || ""}${p.area ? ` · ${p.area}` : ""} · ${p.district || ""} ${p.province || ""}</span><br/>
            <a href="${p.ghb_link}" target="_blank" rel="noopener">ดูรูป-รายละเอียดที่ ธอส. →</a>
          </div>
        `);
        markerClusterGroup.addLayer(marker);
        bounds.push([lat, lng]);
      });

      if (bounds.length) {
        leafletMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
      }

      const cappedNote = rows.length >= 20000
        ? ` (แสดงสูงสุด 20,000 จุดแรก — ลองกรองจังหวัด/อำเภอให้แคบลงเพื่อดูครบทุกจุด)`
        : "";
      mapNote.textContent = `แสดง ${rows.length.toLocaleString("th-TH")} ตำแหน่งบนแผนที่${cappedNote}`;
      mapLoadedForFilters = filterSignature();
    } catch (e) {
      mapNote.textContent = "โหลดตำแหน่งบนแผนที่ไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง";
      console.error(e);
    }
  }

  btnViewList.addEventListener("click", () => {
    btnViewList.classList.add("active");
    btnViewMap.classList.remove("active");
    mapView.style.display = "none";
    document.getElementById("propertyGrid").style.display = "";
    document.getElementById("pagination").style.display = "";
  });

  btnViewMap.addEventListener("click", () => {
    btnViewMap.classList.add("active");
    btnViewList.classList.remove("active");
    mapView.style.display = "block";
    document.getElementById("propertyGrid").style.display = "none";
    document.getElementById("pagination").style.display = "none";
    loadMapMarkers();
    setTimeout(() => leafletMap && leafletMap.invalidateSize(), 100);
  });

  // ถ้าค้นหา/กรองใหม่ตอนอยู่ในมุมมองแผนที่ ให้โหลดหมุดใหม่ด้วย
  document.getElementById("fSubmit").addEventListener("click", () => {
    if (mapView.style.display === "block") loadMapMarkers();
  });
</script>

</body>
</html>
